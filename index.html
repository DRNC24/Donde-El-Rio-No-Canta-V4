<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Donde El Río No Canta</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #171717;
            color: #E5E5E5;
            font-family: Georgia, "Times New Roman", serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;

            opacity: 0;
            animation: aparecer 0.5s ease forwards;
        }

        .pantalla {
            text-align: center;
            padding: 25px;
            animation: revelar 0.8s ease forwards;
        }

        h1 {
            font-size: clamp(2rem, 6vw, 4.5rem);
            font-weight: normal;
            letter-spacing: 3px;
            line-height: 1.3;
            color: #D6D0CC;
            text-shadow: 0 0 25px rgba(190, 45, 45, 0.15);
        }

        .separador {
            width: 80px;
            height: 2px;
            background: #A83232;
            margin: 25px auto 0;
            animation: expandir 0.8s ease forwards;
        }

        body.salir {
            animation: desaparecer 0.5s ease forwards;
        }

        @keyframes aparecer {
            to { opacity: 1; }
        }

        @keyframes revelar {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes expandir {
            from { width: 0; }
            to { width: 80px; }
        }

        @keyframes desaparecer {
            to { opacity: 0; }
        }
    </style>
</head>

<body>
    <main class="pantalla">
        <h1>DONDE EL RÍO<br>NO CANTA</h1>
        <div class="separador"></div>
    </main>

    <script>
        // Tiempo de espera antes de entrar al juego
        setTimeout(() => {
            document.body.classList.add("salir");

            setTimeout(() => {
                window.location.href = "Main.html";
            }, 500);

        }, 1000);
    </script>
</body>
</html>
